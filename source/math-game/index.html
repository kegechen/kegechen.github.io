<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>玩数学 · 配对小游戏</title>
<meta name="theme-color" content="#3aa0dc">
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #eaf6fd; color: #234; overflow: hidden; user-select: none; }
  button { font-family: inherit; cursor: pointer; }
  img, canvas, svg { -webkit-touch-callout: none; -webkit-user-drag: none; }  /* 禁止长按弹出保存图片、拖出图片 */

  /* ---------- 首页 ---------- */
  #home { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 16px 40px; overflow-y: auto; }
  #home h2 { align-self: stretch; max-width: 1180px; width: 100%; margin: 10px auto 0; font-size: 22px; color: #1e88c8; border-left: 6px solid #3aa0dc; padding-left: 10px; }
  #home h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); color: #1e88c8; letter-spacing: 4px; }
  #home h1 span { display: inline-block; background: #1e88c8; color: #fff; border-radius: 50%; width: 1.4em; height: 1.4em; line-height: 1.4em; text-align: center; }
  .cards { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1180px; }
  .card { width: min(260px, 42vw); background: #fff; border: none; border-radius: 18px; padding: 10px 10px 14px; box-shadow: 0 6px 16px rgba(30,136,200,.18); transition: transform .15s; position: relative; }
  .card:hover { transform: translateY(-4px); }
  .card img { width: 100%; border-radius: 10px; display: block; }
  .card .name { margin-top: 10px; font-size: 20px; font-weight: bold; }
  .card .tag { font-size: 14px; color: #1e88c8; }
  .card .done { position: absolute; top: -10px; right: -10px; font-size: 34px; display: none; }
  .card.cleared .done { display: block; }

  /* ---------- 关卡 ---------- */
  #game { height: 100%; display: none; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #3aa0dc; color: #fff; }
  .bar .title { font-size: 22px; font-weight: bold; white-space: nowrap; }
  .bar .desc { flex: 1; font-size: 15px; line-height: 1.35; min-width: 0; }
  .bar button { background: #fff; color: #1e88c8; border: none; border-radius: 22px; padding: 8px 14px; font-size: 16px; font-weight: bold; white-space: nowrap; }
  .main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; }
  .stage { position: relative; background: #fff; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); overflow: hidden; }
  .stage > img, .stage > canvas { display: block; width: 100%; height: 100%; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage svg.pick { pointer-events: none; }
  .stage svg.pick .hot { pointer-events: all; }

  .hot { fill: rgba(255,255,255,0); stroke: transparent; stroke-width: 4; rx: 12; cursor: pointer; transition: fill .15s; }
  .hot:hover { fill: rgba(58,160,220,.10); }
  .hot.sel { stroke: #ff9800; stroke-width: 6; fill: rgba(255,152,0,.12); stroke-dasharray: 14 8; animation: dash 1s linear infinite; }
  .hot.ok { stroke: #43a047; stroke-width: 5; fill: rgba(67,160,71,.08); cursor: default; }
  .hot.flash { animation: flash .35s ease-in-out 4 alternate; }
  @keyframes flash { from { stroke: #ffc107; stroke-width: 4; fill: rgba(255,235,59,.1); } to { stroke: #ff9800; stroke-width: 9; fill: rgba(255,235,59,.55); } }
  .pop-in { transform-box: fill-box; transform-origin: center; animation: pop .4s; }
  .debug .hot { stroke: rgba(255,0,0,.8); stroke-width: 3; }
  .dbg { fill: #d00; font-size: 18px; font-weight: bold; pointer-events: none; }
  .hot.bad { stroke: #e53935; stroke-width: 6; fill: rgba(229,57,53,.15); }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  .link { stroke: #ff5722; stroke-width: 6; stroke-linecap: round; fill: none; }
  .dot { fill: #ff5722; }

  .palette { display: flex; flex-direction: column; gap: 10px; }
  .crayon { width: 86px; height: 50px; border: 4px solid transparent; border-radius: 10px 26px 26px 10px; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,.4); box-shadow: 0 3px 6px rgba(0,0,0,.18); transition: transform .12s; }
  .crayon.on { border-color: #234; transform: translateX(-10px) scale(1.08); }
  .hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(0,0,0,.65); color: #fff; padding: 8px 18px; border-radius: 18px; font-size: 18px; line-height: 1.4; pointer-events: none; opacity: 0; transition: opacity .2s; width: max-content; max-width: 86%; text-align: center; }
  .hint.good { background: rgba(46,125,50,.88); }
  .hint.show { opacity: 1; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  /* ---------- 结尾任务 ---------- */
  .spot-mask { fill: rgba(0,0,0,.6); pointer-events: all; }
  .spot-ring { fill: none; stroke: #ffc107; stroke-width: 8; animation: ring 1s ease-in-out infinite alternate; }
  @keyframes ring { from { stroke-opacity: .35; } to { stroke-opacity: 1; } }
  .finale { position: absolute; left: 4%; top: 12%; width: 34%; background: #fff; border-radius: 20px; padding: 14px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: pop .4s; }
  .finale canvas { width: 62%; height: auto; border-radius: 12px; animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: scale(1.06); } }
  .finale p { margin: 10px 4px; font-size: clamp(14px, 1.7vw, 20px); line-height: 1.5; color: #234; }
  .finale button { margin: 4px 6px; border: none; border-radius: 24px; padding: 10px 18px; font-size: clamp(14px, 1.6vw, 18px); font-weight: bold; background: #e3f2fd; color: #1e88c8; }
  .finale button.primary { background: #43a047; color: #fff; }

  /* ---------- 排行榜 ---------- */
  #btnBoard { position: fixed; top: 10px; right: 12px; z-index: 5; border: none; background: rgba(255,255,255,.6); border-radius: 50%;
              width: 40px; height: 40px; font-size: 20px; opacity: .45; transition: opacity .2s; }
  #btnBoard:hover { opacity: 1; }
  #board { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 12; }
  #board .panel { width: min(760px, 94vw); height: min(620px, 90vh); background: #fff; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; animation: pop .3s; }
  .board-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #3aa0dc; color: #fff; flex-wrap: wrap; }
  .board-head .me { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .board-head .me button, #btnBoardClose { border: none; background: rgba(255,255,255,.25); color: #fff; border-radius: 16px; padding: 4px 10px; font-size: 15px; }
  #btnBoardClose { margin-left: auto; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: none; border-radius: 16px; padding: 6px 14px; font-size: 15px; font-weight: bold; background: rgba(255,255,255,.25); color: #fff; }
  .tabs button.on { background: #fff; color: #1e88c8; }
  .board-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; color: #789; min-height: 40px; }
  .board-bar select { font-size: 15px; padding: 4px 8px; border-radius: 8px; border: 1px solid #bcd; }
  .board-body { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .board-body table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .board-body th { position: sticky; top: 0; background: #f0f7fc; color: #567; font-weight: normal; font-size: 13px; padding: 6px 4px; text-align: center; }
  .board-body td { padding: 7px 4px; border-bottom: 1px solid #eef3f7; text-align: center; white-space: nowrap; }
  .board-body td.name { text-align: left; }
  .board-body tr.me td { background: #fff8e1; font-weight: bold; }
  .board-body .rank1 { color: #f5a623; font-weight: bold; } .board-body .rank2 { color: #9aa5b1; font-weight: bold; } .board-body .rank3 { color: #c47a3a; font-weight: bold; }
  .board-empty { text-align: center; color: #9ab; padding: 40px 0; }
  .card .best { font-size: 14px; color: #f5a623; min-height: 18px; }
  .win-stats { margin: -10px 0 18px; font-size: 16px; color: #567; }
  .win-stats b { color: #e65100; }

  /* ---------- 过关 ---------- */
  #win { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  #win .box { background: #fff; border-radius: 24px; padding: 28px 40px; text-align: center; animation: pop .4s; }
  #win .stars { font-size: 56px; }
  #win h2 { margin: 8px 0 20px; font-size: 30px; color: #1e88c8; }
  #win button { margin: 0 8px; background: #3aa0dc; color: #fff; border: none; border-radius: 26px; padding: 12px 26px; font-size: 20px; font-weight: bold; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 11; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-aspect-ratio: 1/1) {
    .main { flex-direction: column; }
    .palette { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .crayon { width: 64px; height: 44px; border-radius: 22px 22px 10px 10px; font-size: 16px; }
    .crayon.on { transform: translateY(-8px) scale(1.08); }
  }
  @media (max-width: 760px) {
    .bar .desc { display: none; }
    .bar .title { flex: 1; font-size: 18px; }
    .bar button { padding: 6px 10px; font-size: 14px; }
  }
</style>
</head>
<body>

<div id="home">
  <button id="btnBoard" title="排行榜">🏆</button>
  <h1>玩<span>数</span>学 · 配对小游戏</h1>

</div>

      <div class="tabs">
        <button data-tab="total" class="on">总榜</button><button data-tab="level">单关榜</button><button data-tab="mine">我的成绩</button>

      <button id="btnBoardClose" title="关闭">✕</button>
    </div>
    <div class="board-bar">
      <select id="boardLevel"></select>
      <span id="boardSrc"></span>
    </div>
    <div class="board-body" id="boardBody"></div>
  </div>
</div>

<div id="win">
  <div class="box">
    <div class="stars" id="winStars">⭐⭐⭐</div>
    <h2 id="winText"></h2>
    <div class="win-stats" id="winStats"></div>
    <button id="btnWinHome">🏠 首页</button>
    <button id="btnAgain">再玩一次</button>
    <button id="btnNext">下一关 →</button>

 */

let actx;
function tone(freqs, dur = 0.12, type = 'sine', gap = 0.1) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.15);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.2);
    });
  } catch (e) {}
}

let voiceAudio;
function stopVoice() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
// 等当前这句语音结束再执行（没在播放就稍等一下）。
// 读完、被下一句打断（pause）、播放失败（error）都算结束，再加 10 秒兜底，保证 cb 一定会执行，
// 否则小朋友在讲解没读完时又点了别的东西，过关弹窗就永远出不来。
function afterVoice(cb, fallbackMs = 1600) {
  const a = voiceAudio;
  if (!a || a.paused || a.ended) { setTimeout(cb, fallbackMs); return; }
  let fired = false;
  const fire = () => { if (!fired) { fired = true; setTimeout(cb, 300); } };
  ['ended', 'pause', 'error'].forEach(ev => a.addEventListener(ev, fire, { once: true }));
  setTimeout(fire, 10000);
}
function say(text) {
  stopVoice();
  if (VOICE[text]) {
    const a = voiceAudio = new Audio(VOICE[text]);
    a.play().catch(() => a.dispatchEvent(new Event('error')));  // 播放失败也要通知 afterVoice
    return;
  }
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.15;
  speechSynthesis.speak(u);
}

};

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const DEBUG = location.hash === '#debug';  // 在地址后加 #debug 可显示所有热区，用来核对坐标
if (DEBUG) document.documentElement.classList.add('debug');
const cleared = new Set(JSON.parse(localStorage.getItem('mathgame-cleared') || '[]'));
let cur = 0, stage, hintEl, hintTimer, resizeFn;

// 在画面上方显示文字气泡；good 为答对的讲解（绿色），停留时间随字数变长
function hint(text, good = false) {
  hintEl.textContent = text; hintEl.classList.toggle('good', good); hintEl.classList.add('show');
  clearTimeout(hintTimer); hintTimer = setTimeout(() => hintEl.classList.remove('show'), 1200 + text.length * 180);
}
// 答对：说讲解；答错：说引导（具体引导优先，其次本关通用引导）
function praise(teach) { const t = teach || pick(PRAISE); sfx.ok(); hint(t, true); say(t); session.ok(); }
function retry(lv, specific) { const t = specific || lv.hint || pick(RETRY[lv.cat]); sfx.bad(); hint(t); say(t); session.error(); }

function fitStage(w, h) {
  // 让舞台在剩余空间里按原图比例尽量放大
  resizeFn = () => {
    const main = $('main'), pal = main.querySelector('.palette');
    const portrait = main.clientWidth < main.clientHeight;
    let aw = main.clientWidth - 20, ah = main.clientHeight - 20;
    if (pal) { if (portrait) ah -= pal.offsetHeight + 12; else aw -= pal.offsetWidth + 12; }
    const s = Math.min(aw / w, ah / h);
    stage.style.width = (w * s) + 'px'; stage.style.height = (h * s) + 'px';
  };
  resizeFn();
}
window.addEventListener('resize', () => resizeFn && resizeFn());

      if (lv.cat !== cat) return;
      const c = document.createElement('button');
      c.className = 'card' + (cleared.has(lv.id) ? ' cleared' : '');
      c.innerHTML = `<div class="done">🏅</div><img src="${IMG[lv.img]}"><div class="name">${lv.title}</div><div class="tag">${CATS[cat]} · ${lv.tag}</div><div class="best">${bestStars(lv.id)}</div>`;
      c.onclick = () => startLevel(i);
      box.appendChild(c);
    });
  }
}

function startLevel(i) {
  cur = i;
  const lv = LEVELS[i];
  $('home').style.display = 'none'; $('game').style.display = 'flex'; $('win').style.display = 'none';
  $('gTitle').textContent = lv.title; $('gDesc').textContent = lv.desc;
  const main = $('main'); main.innerHTML = '';
  stage = document.createElement('div'); stage.className = 'stage';
  hintEl = document.createElement('div'); hintEl.className = 'hint';
  main.appendChild(stage);
  ({ match: initMatch, fill: initFill, compare: initCompare })[lv.type](lv);
  stage.appendChild(hintEl);
  fitStage(lv.w, lv.h);
  say(lv.desc);
  session.start(lv);
}

function levelDone() {
  const lv = LEVELS[cur];
  cleared.add(lv.id); localStorage.setItem('mathgame-cleared', JSON.stringify([...cleared]));
  const result = session.finish();  // 结尾任务（自己做动作）不计时，在 showFinale 时已停表
  afterVoice(() => {
    const text = lv.winText || WIN_TEXT;
    $('winText').textContent = text; sfx.win(); say(text);
    showResult(result);
    $('btnNext').style.display = cur < LEVELS.length - 1 ? '' : 'none';
    $('win').style.display = 'flex';
    const colors = CRAYONS.map(c => c.color);
    for (let k = 0; k < 60; k++) {
      const d = document.createElement('div'); d.className = 'confetti';
      d.style.left = Math.random() * 100 + 'vw'; d.style.background = pick(colors);
      d.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; d.style.animationDelay = Math.random() * 0.6 + 's';
      document.body.appendChild(d); setTimeout(() => d.remove(), 4500);
    }
  }, 500);
}

/* ================= 连线关 ================= */
function initMatch(lv) {
  const img = new Image(); img.src = IMG[lv.img]; stage.appendChild(img);
  const svg = svgEl('svg', { viewBox: `0 0 ${lv.w} ${lv.h}` });
  const lines = svgEl('g', {}), hots = svgEl('g', {});
  svg.append(lines, hots); stage.appendChild(svg);

  const all = { ...lv.a, ...lv.b }, el = {}, done = new Set();
  let sel = null;
  const center = r => [(r[0] + r[2]) / 2, (r[1] + r[3]) / 2];
  const side = k => (k in lv.a ? 'a' : 'b');
  const partner = k => side(k) === 'a' ? lv.pairs[k] : Object.keys(lv.pairs).find(a => lv.pairs[a] === k);

  function connect(x, y) {
    const [x1, y1] = center(all[x]), [x2, y2] = center(all[y]);
    lines.append(
      svgEl('line', { x1, y1, x2, y2, class: 'link' }),
      svgEl('circle', { cx: x1, cy: y1, r: 8, class: 'dot' }),
      svgEl('circle', { cx: x2, cy: y2, r: 8, class: 'dot' }));
    [x, y].forEach(k => { done.add(k); el[k].classList.remove('sel'); el[k].classList.add('ok'); });
  }

  for (const k in all) {
    const [x1, y1, x2, y2] = all[k];
    const r = svgEl('rect', { x: x1, y: y1, width: x2 - x1, height: y2 - y1, class: 'hot' });
    r.addEventListener('pointerdown', () => {
      if (done.has(k)) return;
      const names = lv.names || {};
      if (!sel || sel === k) {
        sel = sel === k ? null : k; r.classList.toggle('sel', !!sel); sfx.tap();
        if (sel && names[k]) say(names[k]);
        return;
      }
      if (side(sel) === side(k)) { el[sel].classList.remove('sel'); sel = k; r.classList.add('sel'); sfx.tap(); if (names[k]) say(names[k]); return; }
      if (partner(sel) === k) {
        const a = side(k) === 'a' ? k : sel;
        connect(sel, k); sel = null; praise((lv.teach || {})[a]);
        if (done.size === Object.keys(lv.pairs).length * 2) lv.finale ? afterVoice(() => showFinale(lv, svg)) : levelDone();
      } else {
        const prev = sel; sel = null;
        [prev, k].forEach(x => { el[x].classList.remove('sel'); el[x].classList.add('bad'); });
        setTimeout(() => [prev, k].forEach(x => el[x].classList.remove('bad')), 600);
        const a = side(k) === 'a' ? k : prev;
        retry(lv, (lv.hints || {})[a]);
      }
    });
    el[k] = r; hots.appendChild(r);
    if (DEBUG) { const t = svgEl('text', { x: x1 + 4, y: y1 + 18, class: 'dbg' }); t.textContent = k; hots.appendChild(t); }
  }
}

/* ================= 比一比关 =================
 * 点任意一个球：两边都有就一起闪、读出颜色并标记已比过；
 * 点到只有一边有的，它和虚线圆圈一起闪，再点虚线圆圈把球补上。 */
function initCompare(lv) {
  const img = new Image(); img.src = IMG[lv.img]; stage.appendChild(img);
  const svg = svgEl('svg', { viewBox: `0 0 ${lv.w} ${lv.h}` });
  stage.appendChild(svg);
  const [tx, ty, tr] = lv.target;
  let found = false;

  const ring = (x, y) => svgEl('circle', { cx: x, cy: y, r: lv.r, class: 'hot ball' });
  const flash = els => els.forEach(e => { e.classList.remove('flash'); void e.getBBox(); e.classList.add('flash'); });
  const target = svgEl('circle', { cx: tx, cy: ty, r: tr + 6, class: 'hot ball' });

  for (const key in lv.balls) {
    const b = lv.balls[key];
    const els = [b.a, b.b].filter(Boolean).map(([x, y]) => ring(x, y));
    const group = b.b ? els : [...els, target];
    els.forEach(e => {
      e.addEventListener('pointerdown', () => {
        flash(group); hint(b.speak, true); say(b.speak);
        if (b.b) els.forEach(x => x.classList.add('ok'));
        else { found = true; target.classList.add('sel'); }
      });
      svg.appendChild(e);
    });
  }

  target.addEventListener('pointerdown', () => {
    if (target.classList.contains('ok')) return;
    if (!found) { retry(lv); flash([target]); return; }
    const miss = Object.values(lv.balls).find(b => !b.b);
    target.classList.remove('sel');
    svg.querySelectorAll('.ball').forEach(e => e.classList.add('ok'));
    svg.append(
      svgEl('circle', { cx: tx, cy: ty, r: tr, fill: miss.color, class: 'pop-in' }),
      svgEl('ellipse', { cx: tx - tr * .35, cy: ty - tr * .4, rx: tr * .28, ry: tr * .18, fill: 'rgba(255,255,255,.55)', transform: `rotate(-35 ${tx - tr * .35} ${ty - tr * .4})`, class: 'pop-in' }));
    praise(lv.teach); levelDone();
  });
  svg.appendChild(target);
}

/* 结尾任务：压暗其余画面、放大剩下的图形，请小朋友照着做 */
function showFinale(lv, svg) {
  const { key, speak } = lv.finale;
  hintEl.classList.remove('show');
  session.stop();
  const [x1, y1, x2, y2] = lv.b[key] || lv.a[key];
  const pad = 14;
  // 带洞的遮罩 + 闪烁的金框
  svg.append(
    svgEl('path', { class: 'spot-mask', 'fill-rule': 'evenodd',
      d: `M0 0H${lv.w}V${lv.h}H0Z M${x1 - pad} ${y1 - pad}H${x2 + pad}V${y2 + pad}H${x1 - pad}Z` }),
    svgEl('rect', { class: 'spot-ring', x: x1 - pad, y: y1 - pad, width: x2 - x1 + pad * 2, height: y2 - y1 + pad * 2, rx: 14 }));

  // 放大卡片：从原图裁出这个图形
  const card = document.createElement('div'); card.className = 'finale';
  const cv = document.createElement('canvas');
  const sw = x2 - x1 + pad * 2, sh = y2 - y1 + pad * 2, scale = 2.4;
  cv.width = sw * scale; cv.height = sh * scale;
  const img = new Image();
  img.onload = () => cv.getContext('2d').drawImage(img, x1 - pad, y1 - pad, sw, sh, 0, 0, cv.width, cv.height);
  img.src = IMG[lv.img];
  const text = document.createElement('p'); text.textContent = speak;
  const again = document.createElement('button'); again.textContent = '🔊 再听一遍'; again.onclick = () => say(speak);
  const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = '我做好了！';
  ok.onclick = () => { stopVoice(); card.remove(); levelDone(); };  // 不用等动作说明读完
  const btns = document.createElement('div'); btns.append(again, ok);
  card.append(cv, text, btns);
  stage.appendChild(card);
  sfx.win(); say(speak);
}

/* ================= 填色关 ================= */
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function initFill(lv) {
  const cv = document.createElement('canvas'); cv.width = lv.w; cv.height = lv.h;
  stage.appendChild(cv);
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  let base, work, regionMasks;  // base 为原图像素（用于判断区域），work 为当前画面
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, lv.w, lv.h);
    base = ctx.getImageData(0, 0, lv.w, lv.h); work = ctx.getImageData(0, 0, lv.w, lv.h);
    regionMasks = lv.regions.map(r => r.circle ? circleMask(...r.circle) : flood(r.seed[0], r.seed[1]));
  };
  img.src = IMG[lv.img];

  let color = null, pal = null;
  if (lv.blocks) {
    // 积木当调色板：在画布上叠一层只响应积木热区的 SVG
    const svg = svgEl('svg', { viewBox: `0 0 ${lv.w} ${lv.h}`, class: 'pick' });
    const rects = lv.blocks.map(bk => {
      const [x1, y1, x2, y2] = bk.rect;
      const r = svgEl('rect', { x: x1, y: y1, width: x2 - x1, height: y2 - y1, class: 'hot' });
      r.addEventListener('pointerdown', () => {
        color = bk.color; rects.forEach(x => x.classList.remove('sel')); r.classList.add('sel');
        sfx.tap(); say(bk.speak);
      });
      svg.appendChild(r); return r;
    });
    stage.appendChild(svg);
  } else {
    pal = document.createElement('div'); pal.className = 'palette';
    CRAYONS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'crayon'; b.style.background = c.color; b.textContent = c.name;
      b.onclick = () => { color = c.key; pal.querySelectorAll('.crayon').forEach(x => x.classList.remove('on')); b.classList.add('on'); sfx.tap(); say(c.speak); };
      pal.appendChild(b);
    });
    $('main').appendChild(pal);
  }

  const W = lv.w, H = lv.h;
  const isWhite = i => base.data[i] > 200 && base.data[i + 1] > 200 && base.data[i + 2] > 200;

  // 在原图上从 (sx,sy) 做 4 邻域漫水，返回像素下标集合；区域过大说明点到了空白处
  function flood(sx, sy, limit = 60000) {
    const start = sy * W + sx;
    if (!isWhite(start * 4)) return null;
    const seen = new Uint8Array(W * H), stack = [start], out = [];
    seen[start] = 1;
    while (stack.length) {
      const p = stack.pop(); out.push(p);
      if (out.length > limit) return null;
      const x = p % W, y = (p / W) | 0;
      const nb = [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, y > 0 ? p - W : -1, y < H - 1 ? p + W : -1];
      for (const q of nb) if (q >= 0 && !seen[q] && isWhite(q * 4)) { seen[q] = 1; stack.push(q); }
    }
    return { pixels: out, seen };
  }

  // 圆形区域：用于边界是虚线、漫水会漏出去的地方
  function circleMask(cx, cy, r) {
    const seen = new Uint8Array(W * H), out = [];
    for (let y = cy - r; y <= cy + r; y++)
      for (let x = cx - r; x <= cx + r; x++)
        if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) { const p = y * W + x; seen[p] = 1; out.push(p); }
    return { pixels: out, seen };
  }

  const filled = new Set();

  function paint(idx, hex) {
    const reg = lv.regions[idx];
    if (reg.circle) {
      // 画一个带高光的球
      const [cx, cy, r] = reg.circle;
      ctx.fillStyle = hex; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(cx - r * .35, cy - r * .4, r * .28, r * .18, -0.6, 0, Math.PI * 2); ctx.fill();
      work = ctx.getImageData(0, 0, W, H);
      return;
    }
    const { pixels, seen } = regionMasks[idx];
    const [r, g, b] = hexRGB(hex), d = work.data;
    const setPx = p => { d[p * 4] = r; d[p * 4 + 1] = g; d[p * 4 + 2] = b; };
    pixels.forEach(setPx);
    // 向外扩 2 像素，盖住抗锯齿留下的浅色毛边，但不覆盖深色轮廓线
    let edge = pixels;
    for (let k = 0; k < 2; k++) {
      const next = [];
      for (const p of edge) {
        const x = p % W;
        for (const q of [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, p - W, p + W]) {
          if (q < 0 || q >= W * H || seen[q]) continue;
          const i = q * 4, lum = (base.data[i] + base.data[i + 1] + base.data[i + 2]) / 3;
          seen[q] = 1;
          if (lum > 150) { setPx(q); next.push(q); }
        }
      }
      edge = next;
    }
    ctx.putImageData(work, 0, 0);
  }

  cv.addEventListener('pointerdown', e => {
    if (!base) return;
    const rect = cv.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) / rect.width * W);
    const y = Math.round((e.clientY - rect.top) / rect.height * H);
    // 找点中的区域：点击位置落在哪个预先算好的区域里
    const p = y * W + x;
    const idx = regionMasks.findIndex(m => m && m.seen[p]);
    if (idx < 0 || filled.has(idx)) return;
    if (!color) {
      const t = lv.pickHint || PICK_HINT; hint(t); say(t);
      const box = pal || stage; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); return;
    }
    const reg = lv.regions[idx];
    if (reg.answers.includes(color)) {
      filled.add(idx); paint(idx, reg.fill); praise(reg.teach);
      if (filled.size === lv.regions.length) levelDone();
    } else {
      retry(lv, reg.hint);
      stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    }
  });
}

/* ================= 玩家、计分与排行榜 =================
 * 玩家：首次打开自动生成「头像 + 小动物名 + 数字」和随机 ID，存本机，排行榜里可改名。
 * 分数（用于排名）：每关满分 1000 = 准确 600（每错一次 -100）+ 独立完成 100（每重听题目一次 -50）
 *       + 速度 300 × min(1, 极速时长/用时)。极速时长很紧，只有特别快才接近满分，所以几乎不会同分。
 * 星星（用于鼓励，与分数分开算，好拿）：准确 60 + 速度 30（用时在宽松的参考时长内拿满）+ 独立完成 10，
 *       ≥90 三星，≥70 两星，其余一星。
 * 每关只保留分数最高的一局（同分取用时短的），星星跟随那一局。
 * 服务器（worker/worker.js）按同一公式根据用时/错误/重听自己算分和星星，改规则时两边一起改。
 * 联网：API 为空则只用本机；否则成绩先进本机待上传队列，能连上时补传，服务器同样只留最高分。 */
const API = "https://math.ifly.qzz.io";

const ANIMALS = [['🐼', '小熊猫'], ['🐰', '小兔子'], ['🦊', '小狐狸'], ['🐯', '小老虎'], ['🐱', '小猫咪'], ['🐶', '小狗狗'],
                 ['🐧', '小企鹅'], ['🐵', '小猴子'], ['🐸', '小青蛙'], ['🐻', '小熊'], ['🐨', '小考拉'], ['🦁', '小狮子']];
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = ms => { const s = Math.round(ms / 1000); return s < 60 ? `${s}秒` : `${Math.floor(s / 60)}分${String(s % 60).padStart(2, '0')}秒`; };
const starText = n => '⭐'.repeat(n);

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

const player = (() => {
  let p = store.get('mathgame-player', null);
  if (!p || !p.id) {
    const [avatar, animal] = pick(ANIMALS);
    p = { id: uuid(), name: animal + (10 + Math.floor(Math.random() * 90)), avatar };
    store.set('mathgame-player', p);
  }
  return p;
})();

// 本机成绩：{ 玩家ID: { name, avatar, levels: { 关卡ID: { score, timeMs, errors, hints, streak, plays, date } } } }
const records = store.get('mathgame-records', {});
const myLevels = () => (records[player.id] = records[player.id] || { levels: {} }).levels;
const better = (a, b) => !b || a.score > b.score || (a.score === b.score && a.timeMs < b.timeMs);
function bestStars(levelId) {
  const r = myLevels()[levelId];
  return r ? `${starText(r.stars)} ${r.score}分` : '';
}

// 每关的两个时长（都含开头听题目的时间）：
//   极速时长 fast = 5 秒 + 每个配对/区域 2 秒，算排名分；参考时长 ref 宽松，算星星
function levelTimes(lv) {
  const n = lv.type === 'match' ? Object.keys(lv.pairs).length : lv.type === 'fill' ? lv.regions.length : Object.keys(lv.balls).length;
  return { fast: (5 + n * 2) * 1000, ref: (12 + n * (lv.type === 'match' ? 8 : 5)) * 1000 };
}
function scoreOf(c, lv) {
  const speed = Math.round(300 * Math.min(1, levelTimes(lv).fast / Math.max(c.timeMs, 1)));
  return Math.max(0, 600 - 100 * c.errors) + Math.max(0, 100 - 50 * c.hints) + speed;
}
function starsOf(c, lv) {
  const { ref } = levelTimes(lv), t = c.timeMs;
  const speed = t <= ref ? 30 : t >= ref * 3 ? 0 : Math.round(30 * (ref * 3 - t) / (ref * 2));
  const s = Math.max(0, 60 - 10 * c.errors) + speed + Math.max(0, 10 - 5 * c.hints);
  return s >= 90 ? 3 : s >= 70 ? 2 : 1;
}

// 计分规则升级（v1 满分 100 → v2 满分 1000，星星单独算）：用保存的用时/错误/重听重算本机成绩
if (store.get('mathgame-score-v', 1) < 2) {
  for (const r of Object.values(records)) {
    for (const [id, rec] of Object.entries(r.levels || {})) {
      const lv = LEVELS.find(l => l.id === id);
      if (lv) Object.assign(rec, { score: scoreOf(rec, lv), stars: starsOf(rec, lv) });
    }
  }
  store.set('mathgame-records', records);
  store.set('mathgame-score-v', 2);
}

/* ---------- 一局的统计 ---------- */
const session = {
  c: null,
  start(lv) { this.c = { lv, t0: performance.now(), t1: 0, errors: 0, hints: 0, streak: 0, maxStreak: 0, done: false }; },
  ok() { const c = this.c; if (c) { c.streak++; c.maxStreak = Math.max(c.maxStreak, c.streak); } },
  error() { if (this.c) { this.c.errors++; this.c.streak = 0; } },
  hint() { if (this.c) this.c.hints++; },
  stop() { if (this.c && !this.c.t1) this.c.t1 = performance.now(); },
  finish() {
    const c = this.c;
    if (!c || c.done) return null;
    c.done = true; this.stop();
    const run = { timeMs: Math.round(c.t1 - c.t0), errors: c.errors, hints: c.hints, streak: c.maxStreak };
    run.score = scoreOf(run, c.lv);
    run.stars = starsOf(run, c.lv);
    const levels = myLevels(), prev = levels[c.lv.id];
    const isBest = better(run, prev);
    levels[c.lv.id] = { ...(isBest ? { ...run, date: Date.now() } : prev), plays: (prev ? prev.plays : 0) + 1 };
    Object.assign(records[player.id], { name: player.name, avatar: player.avatar });
    store.set('mathgame-records', records);
    queue('/api/score', { playerId: player.id, name: player.name, avatar: player.avatar, level: c.lv.id, ...run });
    return { ...run, isBest, hadPrev: !!prev };
  },
};

function showResult(r) {
  if (!r) return;
  $('winStars').innerHTML = starText(r.stars) + `<span style="opacity:.2">${starText(3 - r.stars)}</span>`;
  $('winStats').innerHTML = `得分 <b>${r.score}</b> · 用时 ${fmtTime(r.timeMs)} · 错 ${r.errors} 次`
    + (r.isBest && r.hadPrev ? ' · 🎉 新纪录！' : '');
}

/* ---------- 上传队列：离线时攒着，联网后补传 ---------- */
function queue(path, body) {
  if (!API) return;
  const box = store.get('mathgame-outbox', []);
  box.push({ path, body });
  store.set('mathgame-outbox', box.slice(-200));
  flush();
}
let flushing = null;
function flush() {
  if (!API || flushing) return flushing || Promise.resolve();
  flushing = (async () => {
    let box = store.get('mathgame-outbox', []);
    while (box.length) {
      try {
        const res = await fetch(API + box[0].path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(box[0].body) });
        if (res.status >= 500) break;           // 服务器出错，下次再试
      } catch (e) { break; }                    // 网络不通，下次再试
      box = store.get('mathgame-outbox', []).slice(1);  // 成功或数据被拒（4xx）都移出队列
      store.set('mathgame-outbox', box);
    }
  })().finally(() => { flushing = null; });
  return flushing;
}
window.addEventListener('online', flush);
flush();

/* ---------- 排行榜面板 ---------- */
let boardTab = 'total';

async function fetchBoard(level) {
  if (!API) return null;
  await flush();
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    const res = await fetch(`${API}/api/board${level ? '?level=' + encodeURIComponent(level) : ''}`, { signal: ctl.signal });
    return res.ok ? (await res.json()).rows : null;
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

// 本机的榜单：用本机所有玩家的最好成绩
function localBoard(level) {
  const rows = Object.entries(records).filter(([, r]) => r.name).map(([id, r]) => ({ id, name: r.name, avatar: r.avatar, levels: r.levels }));
  if (level) {
    return rows.filter(r => r.levels[level]).map(r => ({ ...r, ...r.levels[level] }))
      .sort((a, b) => b.score - a.score || a.timeMs - b.timeMs);
  }
  return rows.map(r => {
    const ls = Object.values(r.levels);
    return { ...r, total: ls.reduce((s, x) => s + x.score, 0), stars: ls.reduce((s, x) => s + x.stars, 0),
             levels: ls.length, timeMs: ls.reduce((s, x) => s + x.timeMs, 0) };
  }).filter(r => r.levels).sort((a, b) => b.total - a.total || a.timeMs - b.timeMs);
}

function table(head, rows) {
  if (!rows.length) return '<div class="board-empty">还没有成绩，快去玩一关吧！</div>';
  return `<table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.join('')}</table>`;
}
const rankCell = i => `<td class="rank${i + 1}">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</td>`;
const nameCell = r => `<td class="name">${esc(r.avatar)} ${esc(r.name)}${r.id === player.id ? '（我）' : ''}</td>`;
const rowTag = r => `<tr${r.id === player.id ? ' class="me"' : ''}>`;

async function renderBoard() {
  const body = $('boardBody'), sel = $('boardLevel'), src = $('boardSrc');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === boardTab));
  sel.style.display = boardTab === 'level' ? '' : 'none';
  $('meAvatar').textContent = player.avatar; $('meName').textContent = player.name;

  if (boardTab === 'mine') {
    src.textContent = '📱 本机记录，每关只留最高分';
    const mine = myLevels();
    body.innerHTML = table(['关卡', '最高分', '星星', '用时', '错误', '最长连对', '玩了几次'], LEVELS.map(lv => {
      const r = mine[lv.id];
      return r ? `<tr><td class="name">${esc(lv.title)}</td><td><b>${r.score}</b></td><td>${starText(r.stars)}</td><td>${fmtTime(r.timeMs)}</td><td>${r.errors}</td><td>${r.streak}</td><td>${r.plays}</td></tr>`
               : `<tr><td class="name">${esc(lv.title)}</td><td colspan="6" style="color:#bbb">还没玩</td></tr>`;
    }));
    return;
  }

  const level = boardTab === 'level' ? sel.value : null;
  body.innerHTML = '<div class="board-empty">加载中…</div>';
  const online = await fetchBoard(level);
  if (boardTab !== (level ? 'level' : 'total') || (level && level !== sel.value)) return;  // 等待期间切换了标签
  const rows = online || localBoard(level);
  src.textContent = online ? '🌐 所有玩家' : API ? '📱 连不上排行榜服务器，先显示本机成绩' : '📱 本机成绩';
  body.innerHTML = level
    ? table(['名次', '玩家', '得分', '星星', '用时', '错误'], rows.map((r, i) =>
        `${rowTag(r)}${rankCell(i)}${nameCell(r)}<td><b>${r.score}</b></td><td>${starText(r.stars)}</td><td>${fmtTime(r.timeMs)}</td><td>${r.errors}</td></tr>`))
    : table(['名次', '玩家', '总分', '星星', '通关', '总用时'], rows.map((r, i) =>
        `${rowTag(r)}${rankCell(i)}${nameCell(r)}<td><b>${r.total}</b></td><td>⭐×${r.stars}</td><td>${r.levels}/${LEVELS.length}</td><td>${fmtTime(r.timeMs)}</td></tr>`));
}

function openBoard() {
  const sel = $('boardLevel');
  if (!sel.options.length) sel.innerHTML = LEVELS.map(lv => `<option value="${lv.id}">${esc(lv.title)}</option>`).join('');
  $('board').style.display = 'flex';
  renderBoard();
}

$('btnBoard').onclick = openBoard;
$('btnBoardClose').onclick = () => { $('board').style.display = 'none'; };
$('board').addEventListener('pointerdown', e => { if (e.target.id === 'board') $('board').style.display = 'none'; });
$('boardLevel').onchange = renderBoard;
document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { boardTab = b.dataset.tab; renderBoard(); }; });
$('btnRename').onclick = () => {
  const name = (prompt('给自己起个名字吧（最多 12 个字）', player.name) || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 12);
  if (!name || name === player.name) return;
  player.name = name; store.set('mathgame-player', player);
  if (records[player.id]) { records[player.id].name = name; store.set('mathgame-records', records); }
  queue('/api/player', { playerId: player.id, name: player.name, avatar: player.avatar });
  renderBoard();
};


/* ================= 防误操作 =================
 * 小朋友常误按右键：不弹菜单，右键点按钮也当作左键点（画面上的物品本来就响应任意键按下）。 */
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  // 只把鼠标右键当点击；触屏长按也会触发 contextmenu，那里只拦菜单，免得和正常点击叠加成两次
  const btn = e.target.closest('button');
  if (btn && e.button === 2) btn.click();
});
document.addEventListener('dragstart', e => e.preventDefault());

/* ================= 按钮 ================= */
$('btnHome').onclick = () => { stopVoice(); $('win').style.display = 'none'; $('game').style.display = 'none'; $('home').style.display = 'flex'; resizeFn = null; buildHome(); };
$('btnWinHome').onclick = () => $('btnHome').click();
$('btnSpeak').onclick = () => { say(LEVELS[cur].desc); session.hint(); };
$('btnReset').onclick = () => startLevel(cur);
$('btnAgain').onclick = () => startLevel(cur);
$('btnNext').onclick = () => startLevel(cur + 1);
buildHome();
